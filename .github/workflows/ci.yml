name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  code:
    name: Code
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: llmoj-ci-disposable-root
          MARIADB_ROOT_HOST: '%'
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Prepare disposable community test databases
        env:
          LLMOJ_CI_DATABASE_SETUP: '1'
          LLMOJ_CI_MARIADB_PASSWORD: llmoj-ci-disposable-root
        run: |
          sudo groupadd --force libreoj
          sudo apt-get update
          sudo apt-get install --yes mariadb-client redis-server
          node deploy/test/setup-community-ci.mjs
      # The suites are listed in deploy/test/run-tests.mjs, which `pnpm test` runs locally
      - name: Run test-data generation regressions
        run: node deploy/test/run-tests.mjs --ci ai
      - name: Run judge data-validation regressions
        run: node deploy/test/run-tests.mjs --ci judge
      - name: Run community and moderation regressions
        run: node deploy/test/run-tests.mjs --ci backend frontend deploy
      - name: Check Wiki export and navigation
        run: node deploy/test/run-tests.mjs --ci wiki

  native:
    name: Native
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Check native inputs
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "native=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$BASE_SHA"
          else
            base="$BEFORE_SHA"
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}"; then
            echo "native=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$base" "$HEAD_SHA" -- \
            .github/workflows/ci.yml \
            .gitmodules \
            .node-version \
            package.json \
            pnpm-lock.yaml \
            pnpm-workspace.yaml \
            apps/judge/CMakeLists.txt \
            apps/judge/native \
            apps/judge/package.json \
            apps/judge/src/launcher \
            apps/judge/test/launcher-fixture.c \
            apps/judge/test/launcher-server.root.cjs \
            apps/judge/vendor/testlib \
            packages/simple-sandbox/CMakeLists.txt \
            packages/simple-sandbox/demo \
            packages/simple-sandbox/native \
            packages/simple-sandbox/package.json \
            packages/simple-sandbox/src; then
            echo "native=false" >> "$GITHUB_OUTPUT"
          else
            echo "native=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.changes.outputs.native == 'true'
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.native == 'true'
        with:
          node-version-file: .node-version
          cache: pnpm
      - if: steps.changes.outputs.native == 'true'
        run: sudo apt-get update && sudo apt-get install --yes libfmt-dev
      - if: steps.changes.outputs.native == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.changes.outputs.native == 'true'
        run: pnpm --filter simple-sandbox build
      - if: steps.changes.outputs.native == 'true'
        run: pnpm build:native
      - if: steps.changes.outputs.native == 'true'
        run: pnpm --filter @libreoj/judge test:native
      - if: steps.changes.outputs.native == 'true'
        name: Check the built-in checker program as the judge starts it
        run: node --test apps/judge/src/checkers/builtin.test.cjs
      - if: steps.changes.outputs.native == 'true'
        run: |
          sudo systemd-run \
            --wait \
            --pipe \
            --collect \
            --property="Delegate=cpu memory pids" \
            --property=DelegateSubgroup=supervisor \
            --property=OOMPolicy=continue \
            --working-directory="$GITHUB_WORKSPACE" \
            "$(command -v node)" packages/simple-sandbox/demo/demo.js
      - if: steps.changes.outputs.native == 'true'
        name: Check the judge's sandbox launcher with real sandboxes
        run: |
          sudo systemd-run \
            --wait \
            --pipe \
            --collect \
            --property="Delegate=cpu memory pids" \
            --property=DelegateSubgroup=supervisor \
            --property=OOMPolicy=continue \
            --working-directory="$GITHUB_WORKSPACE/apps/judge" \
            "$(command -v node)" -r @swc-node/register test/launcher-server.root.cjs

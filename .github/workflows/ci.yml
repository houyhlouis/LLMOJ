name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  code:
    name: Code
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: llmoj-ci-disposable-root
          MARIADB_ROOT_HOST: '%'
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Check extracted source archive
        shell: bash
        run: |
          set -euo pipefail
          source_check_dir="$(mktemp -d "$RUNNER_TEMP/llmoj-source-check.XXXXXX")"
          source_check_store="$(pnpm store path)"
          python3 -B deploy/prepare-github.py --archive "$source_check_dir/source.tar.gz"
          tar -xzf "$source_check_dir/source.tar.gz" -C "$source_check_dir"
          cd "$source_check_dir/LibreOJ"
          pnpm install --frozen-lockfile --offline --store-dir "$source_check_store"
          # Legacy bootstrap types require a Git commit in the extracted tree.
          git init -q -b main
          git add -A
          git -c user.name=source-check -c user.email=source-check@localhost commit -qm "Source archive"
          # Judge type-checking consumes simple-sandbox's generated declarations.
          pnpm --filter simple-sandbox build
          pnpm check-types
          pnpm lint
      - name: Prepare disposable databases and deployment test prerequisites
        env:
          LLMOJ_CI_DATABASE_SETUP: '1'
          LLMOJ_CI_MARIADB_PASSWORD: llmoj-ci-disposable-root
        run: |
          sudo groupadd --force libreoj
          id -u libreoj >/dev/null 2>&1 || sudo useradd --system --gid libreoj --no-create-home --shell /usr/sbin/nologin libreoj
          sudo apt-get update
          sudo apt-get install --yes mariadb-client mariadb-server nginx python3-cryptography python3-yaml redis-server
          node deploy/test/setup-community-ci.mjs
      # The suites are listed in deploy/test/run-tests.mjs, which `pnpm test` runs locally
      - name: Run test-data generation regressions
        run: node deploy/test/run-tests.mjs --ci ai
      - name: Run judge data-validation regressions
        run: node deploy/test/run-tests.mjs --ci judge
      - name: Run community and moderation regressions
        timeout-minutes: 15
        run: node deploy/test/run-tests.mjs --ci backend frontend
      - name: Run deployment regressions and root-owned fixtures
        timeout-minutes: 20
        run: node deploy/test/run-tests.mjs --ci deploy
      - name: Check Wiki export and navigation
        run: node deploy/test/run-tests.mjs --ci wiki

  native:
    # The sandbox, its syscall filter and the judge's native code on both architectures LLMOJ runs on
    name: Native (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-latest
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Check native inputs
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "native=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$BASE_SHA"
          else
            base="$BEFORE_SHA"
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}"; then
            echo "native=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$base" "$HEAD_SHA" -- \
            .github/workflows/ci.yml \
            .gitmodules \
            .node-version \
            package.json \
            pnpm-lock.yaml \
            pnpm-workspace.yaml \
            apps/judge/CMakeLists.txt \
            apps/judge/native \
            apps/judge/package.json \
            apps/judge/src/architecture.ts \
            apps/judge/src/architecture.test.cjs \
            apps/judge/src/languages \
            apps/judge/src/launcher \
            apps/judge/test/launcher-fixture.c \
            apps/judge/test/launcher-server.root.cjs \
            apps/judge/vendor/testlib \
            packages/simple-sandbox/CMakeLists.txt \
            packages/simple-sandbox/demo \
            packages/simple-sandbox/native \
            packages/simple-sandbox/package.json \
            packages/simple-sandbox/test/cgroup-events.cc \
            packages/simple-sandbox/test/cgroup-events.test.mjs \
            packages/simple-sandbox/test/io-redirection.cc \
            packages/simple-sandbox/test/io-redirection.test.mjs \
            packages/simple-sandbox/src; then
            echo "native=false" >> "$GITHUB_OUTPUT"
          else
            echo "native=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.changes.outputs.native == 'true'
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.native == 'true'
        with:
          node-version-file: .node-version
          cache: pnpm
      - if: steps.changes.outputs.native == 'true'
        run: sudo apt-get update && sudo apt-get install --yes libfmt-dev
      - if: steps.changes.outputs.native == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.changes.outputs.native == 'true'
        run: pnpm --filter simple-sandbox build
      - if: steps.changes.outputs.native == 'true'
        run: pnpm build:native
      - if: steps.changes.outputs.native == 'true'
        name: Check cgroup events and redirected file descriptors
        run: node --test packages/simple-sandbox/test/cgroup-events.test.mjs packages/simple-sandbox/test/io-redirection.test.mjs
      - if: steps.changes.outputs.native == 'true'
        run: pnpm --filter @libreoj/judge test:native
      - if: steps.changes.outputs.native == 'true'
        name: Check the built-in checker program as the judge starts it
        run: node --test apps/judge/src/checkers/builtin.test.cjs
      - if: steps.changes.outputs.native == 'true'
        name: Check the C and C++ architectures of this machine
        run: node --test apps/judge/src/architecture.test.cjs
      - if: steps.changes.outputs.native == 'true'
        run: |
          sudo systemd-run \
            --wait \
            --pipe \
            --collect \
            --property="Delegate=cpu memory pids" \
            --property=DelegateSubgroup=supervisor \
            --property=OOMPolicy=continue \
            --working-directory="$GITHUB_WORKSPACE" \
            "$(command -v node)" packages/simple-sandbox/demo/demo.js
      - if: steps.changes.outputs.native == 'true'
        name: Check the judge's sandbox launcher with real sandboxes
        run: |
          sudo systemd-run \
            --wait \
            --pipe \
            --collect \
            --property="Delegate=cpu memory pids" \
            --property=DelegateSubgroup=supervisor \
            --property=OOMPolicy=continue \
            --working-directory="$GITHUB_WORKSPACE/apps/judge" \
            "$(command -v node)" -r @swc-node/register test/launcher-server.root.cjs

name: RootFS

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/rootfs.yml
      - apps/backend/src/code-language/compile-and-run-options/**
      - apps/judge/src/languages/compile-java.sh
      - apps/judge/src/languages/compile-python.sh
      - apps/judge/src/languages/*.ts
      - apps/judge/src/architecture.ts
      - deploy/sandbox/**
      - infra/sandbox-rootfs/**
      - packages/frontend/src/interfaces/CodeLanguage.ts
  # Changes committed straight to main are built too
  push:
    branches: [main]
    paths:
      - .github/workflows/rootfs.yml
      - apps/backend/src/code-language/compile-and-run-options/**
      - apps/judge/src/languages/compile-java.sh
      - apps/judge/src/languages/compile-python.sh
      - apps/judge/src/languages/*.ts
      - apps/judge/src/architecture.ts
      - deploy/sandbox/**
      - infra/sandbox-rootfs/**
      - packages/frontend/src/interfaces/CodeLanguage.ts
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    # Each architecture's recipe, built and smoke-tested on a machine of that architecture
    name: Build (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # The build takes about 19 GiB at its peak: about 9.5 GiB of layers where Docker keeps them, then the 7 GiB tar
      # and its 2.5 GiB archive. Those go to the second disk where there is one (amd64 runners mount it at /mnt), and
      # preinstalled toolchains this job doesn't use make room on the first.
      - name: Make room
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          if mountpoint -q /mnt; then output=/mnt/rootfs; else output="$RUNNER_TEMP/rootfs"; fi
          sudo mkdir -p "$output" && sudo chown "$(id -un)" "$output"
          echo "OUTPUT_DIRECTORY=$output" >> "$GITHUB_ENV"
          df -h / "$output"
      - uses: docker/setup-buildx-action@v3
      # With bash, as the installer runs it: the script isn't executable in Git
      - run: bash infra/sandbox-rootfs/build.sh
        env:
          ROOTFS_ARCHITECTURE: ${{ matrix.architecture }}

name: RootFS

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/rootfs.yml
      - apps/backend/src/code-language/compile-and-run-options/**
      - apps/judge/src/languages/compile-java.sh
      - apps/judge/src/languages/compile-python.sh
      - apps/judge/src/languages/*.ts
      - apps/judge/src/architecture.ts
      - deploy/sandbox/**
      - infra/sandbox-rootfs/**
      - packages/frontend/src/interfaces/CodeLanguage.ts
  # Changes committed straight to main are built too
  push:
    branches: [main]
    paths:
      - .github/workflows/rootfs.yml
      - apps/backend/src/code-language/compile-and-run-options/**
      - apps/judge/src/languages/compile-java.sh
      - apps/judge/src/languages/compile-python.sh
      - apps/judge/src/languages/*.ts
      - apps/judge/src/architecture.ts
      - deploy/sandbox/**
      - infra/sandbox-rootfs/**
      - packages/frontend/src/interfaces/CodeLanguage.ts
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    # Each architecture's recipe, built and smoke-tested on a machine of that architecture
    name: Build (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: ./infra/sandbox-rootfs/build.sh
        env:
          ROOTFS_ARCHITECTURE: ${{ matrix.architecture }}

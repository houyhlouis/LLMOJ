packages:
  - apps/*
  - packages/*
  - infra/frontend-cdn

# The toolchain every package shares (see wiki/Dependencies.md): Node.js 24's type definitions, one TypeScript and one
# Prettier.
catalog:
  "@types/node": 24.19.2
  prettier: 3.9.10
  tsx: 4.23.15
  typescript: 6.0.3

overrides:
  "@types/node": "catalog:"
  # urllib (of ali-oss, for apps/bootstrap-static) can use proxy-agent 5, whose PAC support runs vm2; it isn't needed
  "urllib>proxy-agent": "-"
  # What autotrack's command-line bundler needs; the pages import only its plugins (lib/, which need only dom-utils)
  "autotrack>chalk": "-"
  "autotrack>fs-extra": "-"
  "autotrack>glob": "-"
  "autotrack>google-closure-compiler-js": "-"
  "autotrack>gzip-size": "-"
  "autotrack>rollup": "-"
  "autotrack>rollup-plugin-memory": "-"
  "autotrack>rollup-plugin-node-resolve": "-"
  "autotrack>source-map": "-"

allowBuilds:
  "@nestjs/core": false
  # Sass's file watcher, which builds don't use; its binaries come as optional platform packages
  "@parcel/watcher": false
  # Swagger UI's usage reporting
  "@scarf/scarf": false
  "@swc/core": true
  bcrypt: true
  core-js: false
  esbuild: true
  sharp: true
  # The import resolver's binaries come as optional platform packages
  unrs-resolver: false
  workerd: true

peerDependencyRules:
  allowedVersions:
    # Unmaintained packages whose ranges predate the versions used; checked with them
    "monaco-ace-tokenizer>monaco-editor": 0.57.0
    "react-navi>navi": 0.15.0
    "react-navi>react": 18.3.1

# Behavior the frontend relies on: user names in mentions, and links that don't prefetch on hover
patchedDependencies:
  "markdown-it-mentions@1.0.0": packages/frontend/patches/markdown-it-mentions+1.0.0.patch
  "react-navi@0.15.0": packages/frontend/patches/react-navi+0.15.0.patch

strictDepBuilds: true
disallowWorkspaceCycles: true
failIfNoMatch: true
